[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "melliatlas-backend"
version = "0.1.0"
description = "MelliAtlas Python backend"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "shapely>=2.1,<2.2"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "PyYAML>=6.0.2,<7",
    "pytest>=8.2,<10",
    "pyright>=1.1.400,<2",
    "ruff>=0.13,<1",
    "types-shapely>=2.1.0.20261030,<2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
